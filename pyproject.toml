[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnclab"
version = "0.1.0"
description = "Helpers for a hands-on JSBSim GNC curriculum"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsbsim==1.3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "control>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running solution checks (deselect with -m 'not slow')",
]
